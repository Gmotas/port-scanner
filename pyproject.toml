[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "port-scanner"
version = "1.0.0"
description = "Lightweight TCP port and service-risk scanner to find open ports and insecure services (educational)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gabriel Mota Silva" }]
keywords = ["security", "scanner", "port-scan", "network", "cli", "defensive", "educational"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Gmotas/security-tooling"
Repository = "https://github.com/Gmotas/security-tooling"

[project.scripts]
port-scanner = "port_scanner:main"

[tool.setuptools]
py-modules = ["port_scanner"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]
